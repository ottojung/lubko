[project]
name = "lubko"
version = "0.1.0"
description = "Execute queued development jobs directly inside the Lubko container."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
lubko-worker = "lubko.worker:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-copyright-notice",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]
preview = true

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/lubko/worker.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/**/*.py" = ["assert"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
testpaths = ["tests"]
