[project]
name = "lubko"
version = "0.1.0"
description = "Execute queued development jobs directly inside the Lubko container."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
lubko-worker = "lubko.worker:main"
lubko-supervisor = "lubko.supervisor:main"
lubko-deploy = "lubko.lifecycle:main"
lubko-deploy-ctl = "lubko.deployctl:main"
lubko-agent = "lubko.agent:main"
my-lubko-agent = "lubko.agent:main"
lubko-install = "lubko.install:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-copyright-notice",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]
preview = true

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S608: worker.py builds every query from compile-time constant string
# literals plus the fixed, Final-declared SERVER_MATCH_SQL routing fragment;
# all values are bound parameters, so the string construction carries no
# external data.
"src/lubko/worker.py" = [
    "hardcoded-sql-expression",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/lifecycle.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/deployctl.py" = [
    "collapsible-if",
    "docstring-missing-exception",
    "f-string-in-exception",
    "hardcoded-sql-expression",
    "line-too-long",
    "multiple-with-statements",
    "raise-vanilla-args",
    "raise-within-try",
    "raw-string-in-exception",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "too-many-nested-blocks",
    "too-many-statements-in-try-clause",
    "try-consider-else",
    "typing-only-first-party-import",
]
"src/lubko/agent.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/_start_gate.py" = [
    "start-process-with-no-shell",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/install.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/supervisor.py" = [
    "blind-except",
    "raise-vanilla-args",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"src/lubko/cli.py" = [
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/**/*.py" = [
    "assert",
    "magic-value-comparison",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_deployctl.py" = [
    "private-member-access",
]
"tests/test_agent.py" = [
    "private-member-access",
]
"tests/test_lifecycle.py" = [
    "private-member-access",
]
"tests/test_supervisor_daemon.py" = [
    "private-member-access",
    "too-many-arguments",
    "too-many-positional-arguments",
]
"tests/test_worker.py" = [
    "private-member-access",
]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "lubko.deployctl"
disable_error_code = ["arg-type", "call-overload"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
testpaths = ["tests"]
