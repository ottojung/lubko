name: CI

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LUBKO_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.12"
      - name: Sync
        run: uv sync --frozen --extra dev
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy .
      - name: Tests (with 10 s budget)
        run: uv run python scripts/check_test_budget.py

  ghcr-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive VERSION
        id: gitver
        run: |
          VERSION="$(git describe --tags --always | sed 's/^v//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lubko-base.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/ottojung/lubko-base:${{ steps.gitver.outputs.version }}
            ghcr.io/ottojung/lubko-base:latest

      - name: Pull back latest
        if: github.ref == 'refs/heads/main'
        run: docker pull ghcr.io/ottojung/lubko-base:latest

      - name: Smoke test
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker run --rm ghcr.io/ottojung/lubko-base:latest uv --version
          else
            docker run --rm ghcr.io/ottojung/lubko-base:${{ steps.gitver.outputs.version }} uv --version
          fi
