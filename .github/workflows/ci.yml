name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue21-safe-deploy-rebuild
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync
        run: uv sync --frozen
      - name: Drop inherited watchdog file descriptors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lubko/deployctl.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if pid != 0:
        return
    _close_gate(gate_writer)
    with suppress(OSError):
        os.setsid()
'''
          new = '''    if pid != 0:
        return
    # The fork happens while the parent holds deploy_lock(). Close every
    # inherited non-stdio descriptor before entering the watchdog loop so a
    # parent crash cannot leave the child owning the inherited flock or gate.
    os.closerange(3, int(os.sysconf("SC_OPEN_MAX")))
    with suppress(OSError):
        os.setsid()
'''
          if old not in text:
              raise SystemExit("watchdog child block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format src/lubko/deployctl.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lubko/deployctl.py
          git commit -m "Drop inherited descriptors in rollback watchdog"
          git push origin HEAD:issue21-safe-deploy-rebuild
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy .
      - name: Tests
        run: uv run pytest
