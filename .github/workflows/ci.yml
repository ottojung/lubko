name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Mypy
        run: uv run mypy .
      - name: Tests
        run: uv run pytest
