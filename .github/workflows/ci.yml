name: CI

on:
  push:
    branches:
      - issue21-safe-deploy-rebuild
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue21-safe-deploy-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync
        run: uv sync --frozen
      - name: Normalize branch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lubko/deployctl.py")
          text = path.read_text(encoding="utf-8")
          old = '''            previous = data["previous_meta"]
              replacement = data["new_meta"]
              if not isinstance(previous, dict) or not isinstance(replacement, dict):
                  raise TypeError
              return cls(
                  schema_version=int(data["schema_version"]),
                  status=str(data["status"]),
                  commit=str(data["commit"]),
                  previous_commit=str(data["previous_commit"]),
                  challenge_hash=_optional_string(data.get("challenge_hash")),
                  deadline=float(data["deadline"]),
                  repo=str(data["repo"]),
                  uv_path=str(data["uv_path"]),
                  stop_grace_seconds=float(data["stop_grace_seconds"]),
                  git_timeout_seconds=float(data["git_timeout_seconds"]),
                  previous_meta=WorkerMeta.from_dict(previous),
                  new_meta=WorkerMeta.from_dict(replacement),
              )'''.replace("              ", "            ", 1)
          new = '''            previous = data["previous_meta"]
            replacement = data["new_meta"]
            schema_version = data["schema_version"]
            deadline = data["deadline"]
            stop_grace_seconds = data["stop_grace_seconds"]
            git_timeout_seconds = data["git_timeout_seconds"]
            if not isinstance(previous, dict) or not isinstance(replacement, dict):
                raise TypeError
            if not isinstance(schema_version, int):
                raise TypeError
            numeric_values = (deadline, stop_grace_seconds, git_timeout_seconds)
            if not all(isinstance(value, (int, float)) for value in numeric_values):
                raise TypeError
            return cls(
                schema_version=schema_version,
                status=str(data["status"]),
                commit=str(data["commit"]),
                previous_commit=str(data["previous_commit"]),
                challenge_hash=_optional_string(data.get("challenge_hash")),
                deadline=float(deadline),
                repo=str(data["repo"]),
                uv_path=str(data["uv_path"]),
                stop_grace_seconds=float(stop_grace_seconds),
                git_timeout_seconds=float(git_timeout_seconds),
                previous_meta=WorkerMeta.from_dict(previous),
                new_meta=WorkerMeta.from_dict(replacement),
            )'''
          if old not in text:
              raise SystemExit("rollback-state decode block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format .
          uv run ruff check . --fix || true
          uv run ruff format .
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m "Make rollback state decoding type-safe"
            git push origin HEAD:issue21-safe-deploy-rebuild
          fi
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Mypy
        shell: bash
        run: |
          set +e
          uv run mypy . --show-column-numbers --show-error-codes 2>&1 | tee /tmp/mypy.txt
          rc=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              file=${BASH_REMATCH[1]}
              lineno=${BASH_REMATCH[2]}
              col=${BASH_REMATCH[3]}
              message=${BASH_REMATCH[4]}
              echo "::error file=$file,line=$lineno,col=$col::$message"
            fi
          done < /tmp/mypy.txt
          exit "$rc"
      - name: Tests
        run: uv run pytest
