name: CI

on:
  push:
    branches:
      - issue21-safe-deploy-rebuild
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue21-safe-deploy-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync
        run: uv sync --frozen
      - name: Normalize branch
        run: |
          uv run ruff format .
          uv run ruff check . --fix || true
          uv run ruff format .
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m "Apply safe Ruff fixes for issue 21 rebuild"
            git push origin HEAD:issue21-safe-deploy-rebuild
          fi
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Mypy
        run: uv run mypy .
      - name: Tests
        run: uv run pytest
