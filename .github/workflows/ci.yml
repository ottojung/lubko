name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Mypy
        shell: bash
        run: |
          set +e
          uv run mypy . --show-column-numbers --show-error-codes 2>&1 | tee /tmp/mypy.txt
          rc=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              file=${BASH_REMATCH[1]}
              lineno=${BASH_REMATCH[2]}
              col=${BASH_REMATCH[3]}
              message=${BASH_REMATCH[4]}
              echo "::error file=$file,line=$lineno,col=$col::$message"
            fi
          done < /tmp/mypy.txt
          exit "$rc"
      - name: Tests
        shell: bash
        run: |
          set +e
          uv run pytest --tb=short 2>&1 | tee /tmp/pytest.txt
          rc=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+\.py):([0-9]+):\ (.*)$ ]]; then
              file=${BASH_REMATCH[1]}
              lineno=${BASH_REMATCH[2]}
              message=${BASH_REMATCH[3]}
              echo "::error file=$file,line=$lineno::$message"
            fi
          done < /tmp/pytest.txt
          exit "$rc"
