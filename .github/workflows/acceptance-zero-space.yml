name: Acceptance – Zero-space operation

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:

permissions:
  contents: read

jobs:
  zero-space:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_SPACE_SETUP_HOST: 127.0.0.1
      ZERO_SPACE_SETUP_PORT: 5432
      ZERO_SPACE_SETUP_USER: postgres
      ZERO_SPACE_SETUP_PASSWORD: postgres
      ZERO_SPACE_SETUP_DBNAME: postgres
      ZERO_SPACE_PG_HOST: 127.0.0.1
      ZERO_SPACE_PG_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.12"
      - name: Zero-space acceptance
        run: bash acceptance/zero_space/acceptance.sh
