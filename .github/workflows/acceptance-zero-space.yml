name: Acceptance – Zero-space operation

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:

permissions:
  contents: read

jobs:
  zero-space:
    runs-on: ubuntu-latest
    # TEMPORARY DIAGNOSTIC (revert after use): the step log is not
    # retrievable without interactive access.
    permissions:
      contents: read
      statuses: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_SPACE_SETUP_HOST: 127.0.0.1
      ZERO_SPACE_SETUP_PORT: 5432
      ZERO_SPACE_SETUP_USER: postgres
      ZERO_SPACE_SETUP_PASSWORD: postgres
      ZERO_SPACE_SETUP_DBNAME: postgres
      ZERO_SPACE_PG_HOST: 127.0.0.1
      ZERO_SPACE_PG_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.12"
      - name: Zero-space acceptance
        run: bash acceptance/zero_space/acceptance.sh
      # TEMPORARY DIAGNOSTIC (revert after use): report a short public
      # failure fingerprint as a commit status, since the step log is not
      # retrievable without interactive access. Never fails the workflow
      # itself and never prints secrets.
      - name: Report failure fingerprint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          SCRATCH=""
          for CANDIDATE in /tmp/tmp.* "${RUNNER_TEMP:-/tmp}"/tmp.*; do
            if [ -f "${CANDIDATE}/manifest.before" ]; then
              SCRATCH="${CANDIDATE}"
            fi
          done
          if [ -z "${SCRATCH}" ]; then
            SCRATCH="$(ls -dt /tmp/tmp.* 2>/dev/null | head -n 1)"
          fi
          fingerprint() {
            if [ -z "$1" ] || [ ! -d "$1" ]; then
              printf 'no-scratch-tree-found'
              return 0
            fi
            if [ -f "$1/manifest.after" ]; then
              STAGE="verdict"
            elif [ -f "$1/logs/sup-b.log" ]; then
              STAGE="phase-b"
            elif [ -f "$1/logs/sup-a.log" ]; then
              STAGE="phase-a"
            elif [ -f "$1/manifest.before" ]; then
              STAGE="pre-run"
            elif [ -f "$1/logs/deploy.log" ]; then
              STAGE="deploy"
            elif [ -f "$1/logs/install.log" ]; then
              STAGE="install"
            elif [ -f "$1/logs/dispatch-denials.log" ]; then
              STAGE="selftests"
            elif [ -f "$1/logs/cc.log" ]; then
              STAGE="build"
            else
              STAGE="prerequisites"
            fi
            HITS="$(grep -ahE 'FAIL |cannot reach|cannot|Traceback|Error|error|refused|denied|exceeded' "$1/logs/install.log" "$1/logs/deploy.log" 2>/dev/null | tail -n 3 | tr '\n' '; ')"
            LASTLOG="$(ls -t "$1"/logs/* 2>/dev/null | head -n 1)"
            if [ -n "${LASTLOG}" ]; then
              TAIL="$(tail -n 2 "${LASTLOG}" 2>/dev/null | tr '\n' '; ')"
            else
              TAIL=""
            fi
            OUT="$(printf 'reached:%s; %s %s' "${STAGE}" "${HITS}" "${TAIL}" | sed -E 's/^\.+//; s/ \.+//g; s/ +/ /g')"
            printf '%s' "${OUT}" | sed -E 's/(password|passwd|secret|token)(=|:)[^ ;]*/\1\2***/gi' | cut -c1-140
          }
          verdict_details() {
            if [ -z "$1" ] || [ ! -d "$1" ]; then
              printf 'no-scratch-tree-found'
              return 0
            fi
            STATE_ROOT="$1/home/.local/state/lubko"
            BIN_HOME="$1/home/.local/bin"
            CONFIG_HOME="$1/home/.config/lubko"
            ZERO_ROOTS="${STATE_ROOT}:${BIN_HOME}:${CONFIG_HOME}"
            ESC_ROOTS="$(printf '%s' "${ZERO_ROOTS}" | sed 's/[][\.*^$]/\\&/g; s/:/|/g')"
            DENIAL_LOG="$1/logs/denials.log"
            if [ ! -f "${DENIAL_LOG}" ]; then
              UNEXPECTED="no-denials-log"
            else
              UNEXPECTED="$(grep "^DENY " "${DENIAL_LOG}" | grep -v -E "DENY [a-z0-9-]+ (${ESC_ROOTS})/(supervisor/status\\.json\\.tmp|supervisor/supervisor\\.pid\\.tmp|supervisor/supervisor\\.log|worker/deploy\\.log|worker/logs/[^ ]*|worker/health[^ /]*\\.json|worker/health/health-[^ /]*\\.tmp|worker/drain/[^ /]*\\.tmp|.*__pycache__|.*\\.lubko-durable-lock-[^ ]*|.*\\.lubko-durable-[^ /]*-(state|meta)\\.json)" | head -n 2 | sed "s:$1:ROOT:g" | tr '\n' '; ')"
              if [ -z "${UNEXPECTED}" ]; then
                UNEXPECTED="all-denied-writes-classified"
              fi
            fi
            if [ ! -f "$1/manifest.diff" ]; then
              DIFF="no-manifest-diff"
            else
              DIFF="$(grep -E "^[-+][^-+]" "$1/manifest.diff" | head -n 3 | sed "s:$1:ROOT:g" | tr '\n' '; ')"
              if [ -z "${DIFF}" ]; then
                DIFF="manifest-identical"
              fi
            fi
            printf 'unexpected:%s manifest:%s' "${UNEXPECTED}" "${DIFF}" | sed -E 's/(password|passwd|secret|token)(=|:)[^ ;]*/\1\2***/gi' | cut -c1-140
          }
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            FP="acceptance passed"
            VD="verdict clean"
          else
            STATE="failure"
            FP="$(fingerprint "${SCRATCH}")"
            VD="$(verdict_details "${SCRATCH}")"
          fi
          FP="$(printf '%s' "${FP}" | cut -c1-140)"
          VD="$(printf '%s' "${VD}" | cut -c1-140)"
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "${SHA}" ]; then
            SHA="${{ github.sha }}"
          fi
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="zero-space-fingerprint (temporary)" \
            -f description="${FP}" \
            --silent || true
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="zero-space-verdict (temporary)" \
            -f description="${VD}" \
            --silent || true
          exit 0
